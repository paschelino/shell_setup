# Language runtimes, installed with `mise install`. CLIs come from Homebrew.
# Project-specific versions go into a mise.toml (or .tool-versions) inside the project.
# Versions and checksums are pinned in mise.lock; refresh it with `mise lock --global --bump`.

[tools]
erlang = "27.3.4"
elixir = "1.18"
node = "26"
ruby = "3.4"
java = "temurin-25"

[settings]
# Honour .ruby-version, .nvmrc, ... in projects that don't use mise yet.
idiomatic_version_file_enable_tools = ["node", "ruby"]

# Require `mise trust` for project config and env files (again after every change),
# refuse unregistered plugins and re-verify provenance on every install.
paranoid = true
# Backends that run plugin shell scripts from community repositories.
disable_backends = ["asdf", "vfox"]
