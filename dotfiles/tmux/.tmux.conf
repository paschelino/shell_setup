# XDG_CONFIG_HOME comes from ~/.zshenv, which every pane's shell reads.
set -g default-shell /bin/zsh

# Truecolor, so themes in nvim look the same inside tmux as outside of it
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Setting the prefix from C-b to C-a
set -g prefix C-a

# Ensure that we can send Ctrl-A to other apps
bind C-a send-prefix

# Free the original Ctrl-b prefix keybinding
unbind C-b

# Setting the delay between prefix and command; keeps Esc snappy in nvim
set -s escape-time 1

# Let nvim notice focus changes (e.g. to reload files changed on disk)
set -g focus-events on

set -g history-limit 50000

# Set the window base index to 1 and close gaps when a window is closed
set -g base-index 1
set -g renumber-windows on

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Splits and new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Moving between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick window selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode with vi keys: Prefix [ to enter, v to select, y to copy
setw -g mode-keys vi
# Prefix / goes straight to searching the scrollback
bind / copy-mode \; command-prompt -T search -p "(search up)" { send -X search-backward "%%" }
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Catppuccin Mocha colours, matching Ghostty and nvim
set -g status-style fg="#cdd6f4",bg="#181825"
setw -g window-status-current-style fg="#1e1e2e",bg="#89b4fa",bold
setw -g pane-border-style fg="#45475a"
setw -g pane-active-border-style fg="#89b4fa"
set -g message-style fg="#cdd6f4",bg="#313244"
setw -g mode-style fg="#1e1e2e",bg="#f9e2af"

# The main keys in the status bar, only while the prefix is pressed
set -g status-right-length 100
set -g status-right '#{?client_prefix,#[fg=#1e1e2e]#[bg=#f9e2af] hjkl focus  | - split  c window  z zoom  x close  w switch  [ scroll  / search  ? keys ,"#{=21:pane_title}" %H:%M %d-%b-%y}'

# Mouse
set -g mouse on
